# window size
remember_window_size no
initial_window_width  1600
initial_window_height 1200
enable_audio_bell no

# font
font_family JetBrainsMonoNL Nerd Font
font_size 18

# misc
confirm_os_window_close 0
background_opacity 0.9

# Windows/splits
# TODO: only when not in zellij?
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+n launch --location=split --cwd=current
# map alt+n launch --location=vsplit --cwd=current
# map ctrl+p>r launch --location=vsplit --cwd=current
# map ctrl+p>d launch --location=hsplit --cwd=current
enabled_layouts splits,stack

# Tabs
map ctrl+shift+t launch --type=tab --cwd=current

# BEGIN_KITTY_THEME
# Default
include current-theme.conf
# END_KITTY_THEME

